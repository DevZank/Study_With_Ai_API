[project]
name = "study-api"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.162.0", "pydantic==2.14.3", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py314"
